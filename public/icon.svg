<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Green rounded background -->
  <rect width="512" height="512" rx="96" fill="#15803d"/>

  <!-- Coin stack - back -->
  <ellipse cx="256" cy="360" rx="148" ry="36" fill="#b45309"/>
  <rect x="108" y="280" width="296" height="80" fill="#b45309"/>
  <ellipse cx="256" cy="280" rx="148" ry="36" fill="#d97706"/>

  <!-- Coin stack - middle -->
  <ellipse cx="256" cy="312" rx="148" ry="36" fill="#b45309"/>
  <rect x="108" y="232" width="296" height="80" fill="#b45309"/>
  <ellipse cx="256" cy="232" rx="148" ry="36" fill="#d97706"/>

  <!-- Coin stack - front (top coin face) -->
  <ellipse cx="256" cy="264" rx="148" ry="36" fill="#b45309"/>
  <rect x="108" y="184" width="296" height="80" fill="#b45309"/>
  <ellipse cx="256" cy="184" rx="148" ry="36" fill="#fbbf24"/>
  <!-- Coin face shine ring -->
  <ellipse cx="256" cy="184" rx="120" ry="28" fill="none" stroke="#fde68a" stroke-width="8"/>
  <!-- Dollar sign on top coin -->
  <text x="256" y="200" font-family="system-ui,-apple-system,sans-serif" font-size="52" font-weight="900" text-anchor="middle" dominant-baseline="middle" fill="#92400e">$</text>
</svg>
