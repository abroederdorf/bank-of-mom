<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Green rounded background -->
  <rect width="512" height="512" rx="96" fill="#15803d"/>
  <!-- Vault door outer ring -->
  <circle cx="256" cy="272" r="168" fill="#166534" stroke="#4ade80" stroke-width="12"/>
  <!-- Vault spokes -->
  <line x1="256" y1="104" x2="256" y2="440" stroke="#4ade80" stroke-width="10" stroke-linecap="round"/>
  <line x1="88" y1="272" x2="424" y2="272" stroke="#4ade80" stroke-width="10" stroke-linecap="round"/>
  <line x1="137" y1="153" x2="375" y2="391" stroke="#4ade80" stroke-width="10" stroke-linecap="round"/>
  <line x1="375" y1="153" x2="137" y2="391" stroke="#4ade80" stroke-width="10" stroke-linecap="round"/>
  <!-- Vault inner circle -->
  <circle cx="256" cy="272" r="60" fill="#15803d" stroke="#4ade80" stroke-width="10"/>
  <!-- Vault handle -->
  <rect x="356" y="252" width="72" height="40" rx="20" fill="#4ade80"/>
  <!-- Dollar sign on top -->
  <rect x="220" y="48" width="72" height="16" rx="8" fill="#4ade80"/>
  <text x="256" y="100" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="900" text-anchor="middle" fill="#4ade80">$</text>
</svg>
